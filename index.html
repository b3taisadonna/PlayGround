<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>8 Ball Pool</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand-block">
          <div class="brand-ball">8</div>
          <div class="brand-text"><strong>8 BALL</strong><span>POOL</span></div>
        </div>

        <div class="scoreboard">
          <div class="player-card active" id="p1Card">
            <div class="avatar">P1</div>
            <div class="player-meta">
              <div class="name">Player 1</div>
              <div class="group" id="p1Group">READY</div>
            </div>
          </div>

          <div class="center-box">
            <div class="mode-chip" id="modeChip">LOCAL</div>
            <div class="status" id="statusText">READY</div>
          </div>

          <div class="player-card" id="p2Card">
            <div class="avatar alt">P2</div>
            <div class="player-meta">
              <div class="name">Player 2</div>
              <div class="group" id="p2Group">READY</div>
            </div>
          </div>
        </div>

        <div class="top-actions">
          <button id="btnMode" class="icon-btn">CPU</button>
          <button id="btnReset" class="icon-btn">RESET</button>
        </div>
      </header>

      <main class="stage-wrap">
        <div class="hud-left">
          <div class="panel tiny">
            <span>TABLE</span>
            <strong id="tableTheme">Classic</strong>
          </div>
          <div class="panel tiny">
            <span>MODE</span>
            <strong id="matchMode">2 Players</strong>
          </div>
        </div>

        <canvas id="table" width="1120" height="640" aria-label="8-ball table"></canvas>

        <div class="hud-right">
          <div class="panel">
            <span>POWER</span>
            <strong id="powerText">0%</strong>
          </div>
        </div>
      </main>
    </div>

    <script type="module" src="src/game.js"></script>
  </body>
</html>
